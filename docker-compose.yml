services:
  db:
    image: postgres:16
    env_file:
      - .env
    container_name: teamfinder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: teamfinder_web
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
    command: >
      sh -c "
      until python manage.py migrate; do
        echo 'Waiting for database...';
        sleep 2;
      done &&
      python manage.py runserver 0.0.0.0:8000
      "
    restart: always

volumes:
  postgres_data:
